server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Fingerprinted build assets and self-hosted fonts are immutable.
    location ~ ^/(_astro|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # One canonical URL per page: /path/index.html and /index.html redirect to the directory form.
    location ~ ^(?<dir>/(?:.*/)?)index\.html$ {
        return 308 $dir$is_args$args;
    }

    # A slashless URL that names a generated page directory redirects to its trailing-slash canonical.
    # Files with extensions (assets, sitemap.xml, robots.txt, llms.txt, JSON) are served directly.
    location ~ ^/.+[^/]$ {
        if (-d $document_root$uri) {
            return 308 $uri/$is_args$args;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri/index.html =404;
    }
}
