name: Verify site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify preview build
        run: PUBLIC_SITE_ENV=preview npm run verify
      - name: Verify production build
        env:
          PUBLIC_SITE_ENV: production
          PUBLIC_SITE_ORIGIN: https://aliasmode.com
          PUBLIC_SUPPORT_EMAIL: support@aliasmode.com
          PUBLIC_SECURITY_EMAIL: security@aliasmode.com
          PUBLIC_ANALYTICS_ENDPOINT: https://aliasmode.com/_am/events
        run: npm run verify
      - name: Build preview container
        run: docker build --build-arg PUBLIC_SITE_ENV=preview --tag aliasmode-site:preview .
      - name: Smoke-test preview container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name aliasmode-site-preview --publish 127.0.0.1:18080:8080 aliasmode-site:preview
          trap 'docker rm --force aliasmode-site-preview >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs aliasmode-site-preview
              exit 1
            fi
            sleep 1
          done
          route_headers="$(curl --silent --show-error --head -H 'Host: aliasmode.com' http://127.0.0.1:18080/local-vs-cloud | tr -d '\r')"
          grep -Fx 'HTTP/1.1 200 OK' <<<"$route_headers" >/dev/null
          if grep -i '^Location:' <<<"$route_headers" >/dev/null || grep --fixed-strings ':8080' <<<"$route_headers" >/dev/null; then
            printf '%s\n' "$route_headers"
            exit 1
          fi
          curl --fail --silent -H 'Host: aliasmode.com' http://127.0.0.1:18080/local-vs-cloud >/dev/null
          curl --fail --silent http://127.0.0.1:18080/ | grep --fixed-strings 'noindex,nofollow' >/dev/null
          curl --fail --silent http://127.0.0.1:18080/security/ | grep --fixed-strings 'noindex,nofollow' >/dev/null
      - name: Build production container
        run: |
          docker build \
            --build-arg PUBLIC_SITE_ENV=production \
            --build-arg PUBLIC_SITE_ORIGIN=https://aliasmode.com \
            --build-arg PUBLIC_SUPPORT_EMAIL=support@aliasmode.com \
            --build-arg PUBLIC_SECURITY_EMAIL=security@aliasmode.com \
            --build-arg PUBLIC_ANALYTICS_ENDPOINT=https://aliasmode.com/_am/events \
            --tag aliasmode-site:production .
      - name: Smoke-test production container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name aliasmode-site-production --publish 127.0.0.1:18081:8080 aliasmode-site:production
          trap 'docker rm --force aliasmode-site-production >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs aliasmode-site-production; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18081/robots.txt | grep -Fx 'Sitemap: https://aliasmode.com/sitemap.xml' >/dev/null
          curl --fail --silent http://127.0.0.1:18081/sitemap.xml | grep -F '<loc>https://aliasmode.com/product/</loc>' >/dev/null
          home="$(curl --fail --silent http://127.0.0.1:18081/)"
          grep -F '<link rel="canonical" href="https://aliasmode.com/">' <<<"$home" >/dev/null
          grep -F 'application/ld+json' <<<"$home" >/dev/null
          grep -F 'https://aliasmode.com/_am/events' <<<"$home" >/dev/null
          curl --fail --silent http://127.0.0.1:18081/product | grep -F '<link rel="canonical" href="https://aliasmode.com/product/">' >/dev/null
          if grep -F 'noindex,nofollow' <<<"$home" >/dev/null; then exit 1; fi
